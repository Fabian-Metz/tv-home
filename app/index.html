<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="bg"><i class="glow"></i><i class="vignette"></i></div>

  <div id="clock"></div>
  <div id="date"></div>
  <div id="status"></div>

  <div class="favrow" id="fav0"></div>
  <div class="favrow" id="fav1"></div>

  <div id="moreLabel">Weitere Apps</div>
  <div id="moreClip"><div id="more"></div></div>

  <div id="hint">OK öffnen · Gelb: App-Liste · Rot: neu laden</div>
  <div id="toast"><span id="toastText"></span></div>

  <div id="diag">
    <h2>Diagnose</h2>
    <div id="diagInfo"></div>
    <div id="diagList"></div>
    <div id="diagFoot">Hoch / Runter blättern · Zurück schließen</div>
  </div>
</div>
<script src="config.js"></script>
<script src="main.js"></script>

</html>
